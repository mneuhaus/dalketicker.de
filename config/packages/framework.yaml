# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Behind Traefik (or any reverse proxy): trust the forwarded headers so the
    # app knows the original request was HTTPS and generates correct absolute
    # URLs. Without this, links/redirects/debug-toolbar use http:// and the
    # browser blocks them as mixed content.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    http_client:
        scoped_clients:
            # OpenRouter for the nightly AI passes (dedup/categorize/summarize).
            # Transient failures are retried with backoff (5 s, 20 s; honours
            # Retry-After) — without this a single 429/5xx aborts the whole
            # run and the remaining batches wait a full day for the next one.
            # Timeouts are deliberately NOT retried: POST is not idempotent and
            # a slow model answer would only double the wait. The request-time
            # ContactClassifier stays on the default client — a visitor must
            # not sit through retries while submitting the form.
            openrouter.client:
                base_uri: 'https://openrouter.ai/api/v1/'
                retry_failed:
                    max_retries: 2
                    delay: 5000
                    multiplier: 4
                    http_codes: [429, 500, 502, 503, 504]

    rate_limiter:
        # Contact form: per-IP cap, consumed before the paid AI classifier
        # runs (ContactController). Sliding window so a burst around the hour
        # boundary cannot double the allowance. Stored in the app cache pool;
        # no lock factory since symfony/lock is not installed, which is fine
        # for a spam brake (the classifier is the real gate).
        contact_form:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
