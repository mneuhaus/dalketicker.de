framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # All current browsers support import maps natively (Safari 16.4+, 2023),
        # so we skip the es-module-shims polyfill. That also drops its data:-URI
        # feature probe, which our strict CSP (script-src 'self' 'unsafe-inline')
        # would otherwise block and log on every page load.
        importmap_polyfill: false

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
